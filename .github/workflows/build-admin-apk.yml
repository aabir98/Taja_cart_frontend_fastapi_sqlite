name: Build Admin Android App Bundle

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Inject Admin Environment Variable
        run: echo "VITE_APP_TARGET=admin" > .env

      - name: Build Web App
        run: npm run build

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Swap to Admin Capacitor Config
        run: cp capacitor.admin.config.json capacitor.config.json

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Update Android App Name and ID
        run: |
          sed -i 's/applicationId "com.taja.cart"/applicationId "com.taja.admin"/g' android/app/build.gradle
          sed -i 's/<string name="app_name">Taja Cart<\/string>/<string name="app_name">Taja Admin<\/string>/g' android/app/src/main/res/values/strings.xml
          sed -i 's/<string name="title_activity_main">Taja Cart<\/string>/<string name="title_activity_main">Taja Admin<\/string>/g' android/app/src/main/res/values/strings.xml

      - name: Build Release APK and AAB
        working-directory: ./android
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x ./gradlew
          ./gradlew assembleRelease bundleRelease -Pandroid.injected.signing.store.file=${{ github.workspace }}/android/app/taja-release.keystore -Pandroid.injected.signing.store.password=tajacart2026 -Pandroid.injected.signing.key.alias=taja -Pandroid.injected.signing.key.password=tajacart2026

      - name: Upload Admin APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TajaAdmin-Release-APK
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Upload Admin AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TajaAdmin-Release-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab

